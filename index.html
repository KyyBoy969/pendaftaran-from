<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Tech Fest 2026</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="form-card">
    <header class="form-header">
      <h2>Tech Fest 2026</h2>
      <p>Pendaftaran Online Perwakilan Kelas</p>
    </header>

    <div id="hasil"></div>

    <form id="form-pendaftaran" novalidate>
      <div class="field">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap">
        <small class="error-msg" id="error-nama"></small>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="contoh@domain.com">
        <small class="error-msg" id="error-email"></small>
      </div>

      <div class="form-row">
        <div class="field">
          <label for="kelas">Kelas</label>
          <select id="kelas" name="kelas">
            <option value="">Pilih Kelas</option>
            <option value="X">Kelas X</option>
            <option value="XI">Kelas XI</option>
            <option value="XII">Kelas XII</option>
          </select>
          <small class="error-msg" id="error-kelas"></small>
        </div>

        <div class="field">
          <label for="jurusan">Jurusan</label>
          <select id="jurusan" name="jurusan">
            <option value="">Pilih Jurusan</option>
            
            <option value="RPL">RPL</option>
            <option value="TKJ">TKJ</option>
            <option value="DKV">PF</option>
          </select>
          <small class="error-msg" id="error-jurusan"></small>
        </div>
      </div>

      <div class="field">
        <label for="kegiatan">Kegiatan / Lomba</label>
        <input type="text" id="kegiatan" name="kegiatan" placeholder="Contoh: Web Design">
        <small class="error-msg" id="error-kegiatan"></small>
      </div>

      <div class="field checkbox-field">
        <label>
          <input type="checkbox" id="syarat" name="syarat">
          <span>Saya menyetujui Syarat & Ketentuan</span>
        </label>
        <small class="error-msg" id="error-syarat"></small>
      </div>

      <button type="submit" id="btn-submit">Daftar Sekarang</button>
    </form>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
